openapi: 3.0.0
info:
  title: Remote Services API v1.2.0
  version: 1.0.0
  description: >-
    The Remote Services API is designed to allow external systems to remotely
    control and interact with specific functions of a vehicle. This API is
    particularly useful for enabling remote access to vehicles for various
    purposes such as convenience, security, and pre-emptive climate control.


    Currently, the following key remote actions are supported:


    - Turn engine on

    - Turn engine off

    - Get engine status

    - Get climate settings

    - Set climate settings

    - Lock doors

    - Unlock doors
        

    <img
    src="https://voyager.postman.com/illustration/get-in-touch-postman-hoverboard-illustration.svg"
    width="240" height="180">


    ### Security and Privacy Considerations


    - Secure authentication is required to access the API.

    - Actions are logged for security and auditing purposes.

    - Only authorized users or systems can interact with vehicle controls.
        

    ### Scalability and Reliability


    - Designed to handle a high number of requests with minimal latency.

    - Reliable communication with vehicle systems for real-time control.
        

    ### Integration


    - API is compatible with various vehicle models and makes.

    - Supports integration with mobile apps and smart home systems.
servers:
  - url: '{{baseUrl}}'
paths:
  /v1/vehicles/{vin}/engine/start:
    get:
      summary: Turn engine on
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Engine started.
        '400':
          description: Action disabled by user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: This action was disabled by the user.
        '500':
          description: Unexpected error
      tags:
        - Engine
      description: >-
        Successful execution will turn the engine on. Users must have the remote
        access feature enabled in their Connected Vehicle account and all
        maintence indicators in a satisfactory state or the action will not be
        authorized.
    parameters:
      - name: vin
        in: path
        required: true
        description: (Required) Required 17-character VIN (Vehicle Identification Number)
        schema:
          type: string
        example: 4Y1SL65848Z411439
  /v1/vehicles/{vin}/engine/stop:
    get:
      summary: Turn engine off
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Engine stopped.
        '500':
          description: Unexpected error
      tags:
        - Engine
      description: >-
        Turns the engine off upon successful execution. Users must have the
        remote access feature enabled in their Connected Vehicle account and all
        maintence indicators in a satisfactory state or the action will not be
        authorized.
    parameters:
      - name: vin
        in: path
        required: true
        description: (Required) Required 17-character VIN (Vehicle Identification Number)
        schema:
          type: string
        example: 4Y1SL65848Z411439
  /v1/vehicles/{vin}/engine/status:
    get:
      summary: Get engine status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  coolantTemp:
                    type: string
                  oilPressure:
                    type: string
                  oilTemp:
                    type: string
                  rpm:
                    type: string
                  running:
                    type: string
              example:
                coolantTemp: <number>
                oilPressure: <number>
                oilTemp: <number>
                rpm: <number>
                running: <boolean>
        '500':
          description: Unexpected error
      tags:
        - Engine
      description: >-
        As status checks are core features of the PM connected car experience,
        this feature is allowed by default in the customer account settings.
        However, users do have the option to revoke remote status reporting
        access to APIs and rely only on the car dashboard indicators. Thus,
        developers should check for a successful response before continuing with
        any further workflows.
    parameters:
      - name: vin
        in: path
        required: true
        description: (Required) Required 17-character VIN (Vehicle Identification Number)
        schema:
          type: string
        example: 4Y1SL65848Z411439
  /v1/vehicles/{vin}/interior/climate:
    get:
      summary: Get climate settings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ac:
                    type: string
                  fanspeed:
                    type: string
                  temp:
                    type: string
              example:
                ac: <boolean>
                fanspeed: <number>
                temp: <string>
        '500':
          description: Unexpected error
      tags:
        - Climate Settings
      description: >-
        Gets the current interior climate settings for the connected car. Users
        must have the remote access feature enabled in their Connected Vehicle
        account or the action will not be authorized. If the car is off, the
        system will return the climate settings used in the last session.
    parameters:
      - name: vin
        in: path
        required: true
        schema:
          type: string
        example: <string>
    post:
      summary: Set climate settings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: <string>
        '500':
          description: Unexpected error
      tags:
        - Climate Settings
      description: >-
        Sets the climate controls for the connected car. Users must have the
        remote access feature enabled in their Connected Vehicle account or the
        action will not be authorized. If the car is on, the settings will be
        applied immediately. If the car is off, the settings will be saved and
        used in the next session.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ac:
                  type: string
                fanspeed:
                  type: string
                  format: utc-millisec
                temp:
                  type: string
            example:
              ac: 'true'
              fanspeed: '8'
              temp: hot
  /v1/vehicles/{vin}/lock:
    post:
      summary: Lock
      responses: {}
      tags:
        - Doors & Windows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
            example:
              target: doors
    parameters:
      - name: vin
        in: path
        required: true
        description: (Required) Required 17-character VIN (Vehicle Identification Number)
        schema:
          type: string
        example: 4Y1SL65848Z411439
    get:
      summary: Check status of doors & windows
      responses: {}
      tags:
        - Doors & Windows
  /v1/vehicles/{vin}/unlock:
    post:
      summary: Unlock
      responses: {}
      tags:
        - Doors & Windows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
            example:
              target: doors
    parameters:
      - name: vin
        in: path
        required: true
        description: (Required) Required 17-character VIN (Vehicle Identification Number)
        schema:
          type: string
        example: 4Y1SL65848Z411439
